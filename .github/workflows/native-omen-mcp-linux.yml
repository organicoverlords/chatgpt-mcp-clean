name: Native OMEN MCP Linux CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  native-omen-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:native-omen-mcp
